[package]
name = "stellar-sim"
version = "0.1.0"
edition = "2021"
description = "A skeleton simulation of Stellaris 4.5.2's progression (tick, day, month, year), with the PDXScript layer in embedded LuaJIT. See docs/simulation.md."
license = "MIT"
publish = false

[dependencies]
# LuaJIT 2.1, as in the game's runtime; vendored: built from source with the C compiler (MSVC).
mlua = { version = "0.11", features = ["luajit", "vendored"] }
# reading save games (a .sav is a zip of `gamestate` and `meta`)
zip = { version = "2", default-features = false, features = ["deflate"] }
# the game's files watched for changes (sim/src/vfs.rs: inotify, ReadDirectoryChangesW, FSEvents)
notify = "8"

# LuaJIT's sources with compiled code checking the hooks, so that a deadline stops it
# (sim/vendor/README.md, sim/src/preempt.rs)
[patch.crates-io]
luajit-src = { path = "vendor/luajit-src" }
