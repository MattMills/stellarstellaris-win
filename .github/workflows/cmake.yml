name: Build stellarstellaris Windows

on:
  push:
    branches: [ master ]
  pull_request:
    branches: [ master ]
  workflow_dispatch:

env:
  # Customize the CMake build type here (Release, Debug, RelWithDebInfo, etc.)
  BUILD_TYPE: RelWithDebInfo

jobs:
  build:
    runs-on: windows-latest

    steps:
    - uses: actions/checkout@v4
      with:
        # lua_fnmatch has the stellar-fnmatch engine as a submodule
        submodules: recursive

    # cl on the PATH, for LuaJIT's msvcbuild.bat (the runner has Ninja and Rust)
    - uses: ilammy/msvc-dev-cmd@v1

    - name: Configure CMake
      run: cmake -G Ninja -B ${{github.workspace}}/build -DCMAKE_BUILD_TYPE=${{env.BUILD_TYPE}}

    - name: Build
      run: cmake --build ${{github.workspace}}/build

    - name: Archive build artifacts
      uses: actions/upload-artifact@v4
      with:
        name: StellarStellaris Executables
        path: |
          ${{github.workspace}}/build/*.exe
          ${{github.workspace}}/build/*.dll
          ${{github.workspace}}/build/*.pdb
          ${{github.workspace}}/build/lua/
